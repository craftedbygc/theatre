# Deploy the Theatre.js playground as a static site.
# Each PR gets a Netlify Deploy Preview; merges to main update production.
#
# Netlify UI (Site configuration → Build & deploy → Build settings):
#   • Base directory: "packages/playground" (or leave blank and use publish below as-is)
#   • Publish directory: leave BLANK — this file sets it
#
# Publish is relative to the base directory. With base = packages/playground, use "build"
# (Vite writes to packages/playground/build). Yarn install runs from monorepo root.

[build]
  command = "cd ../.. && corepack enable && yarn install --immutable && yarn workspace playground run build"
  publish = "build"
  # Diff the full repo (no path filter). Do not append " .." — git treats that as revision
  # range syntax, so theatre-only PRs look unchanged when the base directory is packages/playground.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF"

# Deploy previews must always build: PRs need a preview URL even when the ignore diff above
# would skip (e.g. CACHED_COMMIT_REF equals COMMIT_REF on a re-run).
[context.deploy-preview]
  ignore = "false"

[build.environment]
  NODE_VERSION = "18"
